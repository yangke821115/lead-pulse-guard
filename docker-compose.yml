services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    read_only: true
    volumes:
      - ./data/spool:/spool
      - ./secrets/meta-app-secret:/run/secrets/meta_app_secret:ro
      - ./pages.json:/etc/leadpulse/pages.json:ro
    tmpfs:
      - /tmp
    environment:
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?set META_VERIFY_TOKEN in .env}
      META_APP_SECRET_FILE: /run/secrets/meta_app_secret
      EVENT_SPOOL_FILE: /spool/events.jsonl
      EVENT_SPOOL_MAX_BYTES: ${EVENT_SPOOL_MAX_BYTES:-33554432}
      PAGES_CONFIG_FILE: /etc/leadpulse/pages.json
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ./data/spool:/var/lib/leadpulse/spool
      - ./data/state:/var/lib/leadpulse/state
      - ./secrets:/etc/leadpulse:ro
    environment:
      LPW_BASE: /app/worker
      LPW_SECRETS: /etc/leadpulse
      LPW_GRAPH_SECRETS: /etc/leadpulse/graph
      LPW_STATE: /var/lib/leadpulse/state
      AIW_SPOOL: /var/lib/leadpulse/spool/events.jsonl
      AIW_POST_ENABLED: ${AIW_POST_ENABLED:-false}
      AIW_DOMAIN_ENUM: ${AIW_DOMAIN_ENUM:-general,other}
      AIW_FORM_FIELDS: /app/worker/lead-form-fields.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mail:
    build: ./worker
    restart: unless-stopped
    command: ["python", "-m", "worker.mail"]
    volumes:
      - ./data/state:/var/lib/leadpulse/state
      - ./secrets:/etc/leadpulse:ro
environment:
    LPW_BASE: /app/worker
    LPW_SECRETS: /etc/leadpulse
    LPW_STATE: /var/lib/leadpulse/state
    AIW_MAIL_STATE: /var/lib/leadpulse/state/mail
    AIW_MAIL_ACCOUNTS: /etc/leadpulse/mail-accounts.json
    AIW_MAIL_IMAP_HOST: ${AIW_MAIL_IMAP_HOST:-}
    AIW_MAIL_IMAP_PORT: ${AIW_MAIL_IMAP_PORT:-993}
    AIW_MAIL_POLL: ${AIW_MAIL_POLL:-600}
    AIW_MAIL_OWN_DOMAINS: ${AIW_MAIL_OWN_DOMAINS:-}
logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
